{% extends "base.html" %}
{% block title %}Create Quiz{% endblock %}
{% block page_title %}Create Quiz / Assignment{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header text-white" style="background:linear-gradient(135deg,#7c3aed,#6d28d9);">
        <h5 class="mb-0">New Quiz</h5>
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Course</label>
                    <select name="course_id" class="form-select" required>
                        {% for c in courses %}
                        <option value="{{ c.course_id }}">{{ c.course_code }} - {{ c.course_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Title</label>
                    <input type="text" name="title" class="form-control" placeholder="e.g., Mid‑Term Test" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Quiz Type</label>
                    <select name="quiz_type" class="form-select">
                        <option value="mcq">MCQ</option>
                        <option value="short_answer">Short Answer</option>
                        <option value="mixed">Mixed</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold">Time Limit (mins)</label>
                    <input type="number" name="time_limit" class="form-control" placeholder="Leave empty for none">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold">Total Marks</label>
                    <input type="number" name="total_marks" class="form-control" value="10">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Start Time</label>
                    <input type="datetime-local" name="start_time" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">End Time</label>
                    <input type="datetime-local" name="end_time" class="form-control" required>
                </div>
                <div class="col-12">
                    <label class="form-label fw-bold">Description (optional)</label>
                    <textarea name="description" class="form-control" rows="2"></textarea>
                </div>
                <!-- AI Generation -->
                <div class="col-12 mt-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="use_ai" id="use_ai">
                        <label class="form-check-label fw-bold" for="use_ai">Generate questions with AI</label>
                    </div>
                    <div id="ai_fields" style="display:none;" class="mt-2">
                        <label class="form-label">Topic</label>
                        <input type="text" name="ai_topic" class="form-control" placeholder="e.g., Normalization">
                        <label class="form-label mt-2">Number of questions</label>
                        <input type="number" name="num_ai_questions" class="form-control" value="5">
                    </div>
                </div>
                <div class="col-12 mt-3">
                    <button type="submit" class="btn btn-primary" style="background:#7c3aed; border:none;">Create Quiz</button>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
document.getElementById('use_ai').addEventListener('change', function() {
    document.getElementById('ai_fields').style.display = this.checked ? 'block' : 'none';
});
</script>
{% endblock %}
