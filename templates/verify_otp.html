{% extends "base.html" %}
{% block title %}Verify OTP{% endblock %}
{% block page_title %}Verify OTP{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-header"><h5 class="mb-0">Enter OTP</h5></div>
            <div class="card-body">
                <p class="text-secondary">OTP has been displayed on the previous page.</p>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Enter 6-digit OTP</label>
                        <input type="text" name="otp" class="form-control" placeholder="123456" required maxlength="6">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Verify OTP</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
